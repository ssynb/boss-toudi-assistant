<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>对话 · boss 投递助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<div class="shell">
<nav class="sidebar" aria-label="主导航">
<strong class="brand"><span class="logo" aria-hidden="true"></span><span>投递助手</span></strong>
<a href="#chat" data-view="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span>对话</span></a>
<a href="#profile" data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>个人信息</span></a>
<a href="#records" data-view="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>投递记录</span></a>
</nav>
<div class="main">
<header class="topbar"><div class="accounts"><button data-action="codex/login" id="codex" class="chip">Codex 登录</button><a id="login" class="chip" target="_blank" rel="noopener" hidden>继续官方授权</a><button data-action="browser/open" id="browser" class="chip">BOSS 登录</button></div></header>
<p id="error" role="alert" hidden></p>

<section id="view-chat" class="view chat" aria-label="对话">
<div class="scroller" id="chat-scroller">
<div class="column">
<div id="chat-empty" class="empty" hidden>
<h1>想找什么样的工作？</h1>
<p>告诉我方向和数量，我会调研或直接开始投递。</p>
<div class="examples"><button type="button">我适合投哪些方向？</button><button type="button">Agent开发投30个，AI应用投20个</button><button type="button">深圳 AI 应用岗位一般要求什么？</button></div>
</div>
<ol id="chat-log" role="log" aria-live="polite" aria-label="对话记录"></ol>
<p id="chat-thinking" class="thinking" hidden>正在思考…</p>
</div>
</div>
<div class="composer-wrap"><div class="column">
<div id="progress" class="progress" role="status" aria-label="任务进度" hidden><span class="pulse" aria-hidden="true"></span><span id="progress-text"></span><button id="progress-stop" type="button" class="stop">停止</button></div>
<form id="chat-form" class="composer"><label for="chat-input" class="sr-only">发消息</label><textarea id="chat-input" name="message" rows="1" maxlength="2000" placeholder="例如：Agent开发投30个"></textarea><button id="chat-send" class="send">发送</button></form>
<div class="composer-foot"><span>说出数量即直接开始投递；结果未确认的不会自动重试</span><button id="chat-clear" type="button" class="link" hidden>清空对话</button></div>
</div></div>
</section>

<section id="view-profile" class="view page" aria-labelledby="profile-title" hidden><div class="column">
<h1 id="profile-title">个人信息</h1>
<form id="inputs"><fieldset>
<label class="field">简历文件<input name="file" type="file" accept=".txt,.md,.pdf,.docx"><span id="file" class="hint"></span></label>
<label class="field" id="resume-body" hidden>简历正文<textarea name="resumeText" rows="8" maxlength="50000" placeholder="粘贴 PDF / DOCX 正文，保存即确认用于匹配"></textarea></label>
<label class="field">求职偏好（可选）<textarea name="requirements" rows="4" maxlength="10000" placeholder="例如：深圳，月薪至少 25K，不考虑外包"></textarea></label>
<div class="form-foot"><button id="save" class="primary">保存</button><output></output></div>
<p class="hint">简历只在本机用于匹配，不会上传 BOSS。</p>
</fieldset></form>
</div></section>

<section id="view-records" class="view page" aria-labelledby="records-title" hidden><div class="column">
<div class="page-head"><h1 id="records-title">投递记录</h1><button id="resume-batch" class="primary" hidden>继续投递</button></div>
<p id="records-summary" class="summary"></p>
<p class="hint">结果未确认的岗位不会自动重试，请到 BOSS 本人核查。</p>
<ul id="records" class="records"></ul>
<p id="records-empty" class="hint" hidden>还没有投递记录。在对话里说出方向和数量即可开始。</p>
</div></section>
</div>
</div>
</body></html>
