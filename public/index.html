<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>boss 投递助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<header><strong>boss 投递助手</strong><div class="accounts"><button data-action="codex/login" id="codex">Codex 登录</button><a id="login" target="_blank" rel="noopener" hidden>继续官方授权</a><button data-action="browser/open" id="browser">BOSS 登录</button></div></header>
<main><p id="error" role="alert" hidden></p><p id="notice" role="status"></p>
<form id="inputs"><fieldset>
<label for="requirements-text">具体要求</label><textarea id="requirements-text" name="requirements" rows="4" maxlength="10000" placeholder="例如：杭州前端，月薪至少 25K，不考虑外包，先找 10 个岗位。"></textarea>
<div id="clarification" role="status" hidden><ul id="questions"></ul></div>
<label class="file-label">简历<input name="file" type="file" accept=".txt,.md,.pdf,.docx"></label><p id="file" class="hint"></p>
<label id="resume-body" hidden>简历正文<textarea name="resumeText" rows="5" maxlength="50000" placeholder="粘贴 PDF / DOCX 正文，保存即确认用于匹配"></textarea></label>
<p class="hint">本地简历仅用于匹配，不上传 BOSS。</p><button id="save">保存</button><output></output>
</fieldset></form>
<div class="discovery-actions"><button id="discover" class="primary">开始发现</button><span id="elapsed" aria-label="发现耗时"></span><span id="discovery" role="status"></span></div>
<section id="batch" hidden><p id="batch-state"></p><div id="targets"></div><form id="delivery"><fieldset><label class="check"><input type="checkbox" name="enabled">发送 BOSS 网站已有的附件简历</label><p class="hint">默认不发附件。这不是上方上传的本地文件。</p><label>站点附件完整文件名<input name="bossAttachmentName"></label><label class="check"><input type="checkbox" name="bossAttachmentConfirmed">我已在 BOSS 核对附件名，并确认发送此附件</label><button>保存附件设置</button><output></output></fieldset></form><div class="approval"><p>批准将授权联系本批保留的 HR（「立即沟通」可能自动招呼），发送审阅后的招呼原文及已确认的站点附件。修改会使旧批准失效。</p><button id="approve" class="primary">批准整批</button> <button data-action="batch/start">开始 / 继续执行</button> <button data-action="batch/pause">暂停执行</button></div></section>
<details><summary>运行记录</summary><ol id="logs"></ol></details></main></body></html>
