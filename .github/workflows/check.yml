name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['24.11.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BOSS_CLOAK_LICENSE_ACCEPTED: ${{ vars.CLOAK_BINARY_LICENSE_ACCEPTED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 由仓库所有者审阅许可后设置变量为 1.3；未确认时 setup 明确失败，不代用户接受。
      - run: npm run setup -- --install-cloak
      - run: npm run check
        timeout-minutes: 3
